name: CI

# Every pull request and every push to main. The release workflow calls it too (workflow_call), so nothing is
# released that does not pass it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      android:
        description: Also check that the Android app builds (the release workflow builds it itself).
        type: boolean
        default: true

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main and release checks always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (versions, typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Versions agree
        run: node scripts/check-version.mjs --changelog

      # The engine is Rust; the frontend tests and the web build use its WebAssembly build.
      - name: Build the Rust engine (WebAssembly)
        run: bun run build:engine

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (warning count may only go down)
        run: bun run lint

      - name: Unit tests
        run: bun run test --run

      - name: Build (vite)
        run: bun run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          frontend: "false"
          rust-targets: ""
          rust-components: clippy, rustfmt
          linux-deps: "true"

      # Formatting does not depend on the platform: checked once.
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Clippy and the tests run everywhere: the engine and the desktop shell have platform-specific code.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (engine and desktop shell)
        run: cargo test --workspace

  android:
    name: Android (unsigned APK)
    # Skipped only when the release workflow passes android: false (inputs are empty on other events).
    if: format('{0}', inputs.android) != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The runner image includes the Android SDK; the NDK version is pinned (same as the release workflow).
      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          rust-targets: aarch64-linux-android,wasm32-unknown-unknown
          cache-key: android

      # No signing key here: this checks that the Android app builds. Releases are signed (release.yml).
      - name: Build the APK
        run: bun run tauri android build --apk --target aarch64

      - name: Check the APK
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          test -n "$apk"
          ls -l "$apk"
          aapt2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt2"
          badging="$("$aapt2" dump badging "$apk" | head -n 1)"
          echo "$badging"
          version="$(node scripts/check-version.mjs)"
          echo "$badging" | grep -q "versionName='$version'" || { echo "APK version is not $version" >&2; exit 1; }
