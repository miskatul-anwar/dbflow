version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The Cargo workspace (engine, WebAssembly build, desktop shell) and its Cargo.lock are at the root.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The Android project generated by Tauri.
  - package-ecosystem: gradle
    directory: "/src-tauri/gen/android"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      android:
        patterns:
          - "*"

  # Actions used by the workflows and by the shared setup action.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: monthly
