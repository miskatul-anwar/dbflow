[package]
name = "dbflow"
version = "6.0.0"
description = "DBFlow — turn raw CSVs into normalized database schemas"
authors = ["Miskatul Anwar <miskatul.anwar.csecu@gmail.com>"]
license = "MIT"
repository = "https://github.com/miskatul-anwar/dbflow"
edition = "2021"
rust-version = "1.80"

[lib]
name = "dbflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dbflow-core = { path = "../crates/dbflow-core" }
tauri-plugin-notification = "2"
