[workspace]
resolver = "2"
members = ["crates/dbflow-core", "crates/dbflow-wasm", "src-tauri"]

[workspace.package]
version = "6.6.1"
authors = ["Miskatul Anwar <miskatul.anwar.csecu@gmail.com>"]
license = "MIT"
repository = "https://github.com/miskatul-anwar/dbflow"
edition = "2021"
rust-version = "1.80"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.dbflow-wasm]
opt-level = 3
